# Build settings live in the repo so a deploy is atomic with its commit
# (previously configured in the Netlify UI as `gatsby build` / `public`).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # explicit so a stale NODE_VERSION in the Netlify UI (pinned 18 in the
  # Gatsby era) can't override .nvmrc
  NODE_VERSION = "22"

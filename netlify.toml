# Build settings live in the repo so a deploy is atomic with its commit
# (previously configured in the Netlify UI as `gatsby build` / `public`).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # explicit, in-repo statement of the build's Node version; the Netlify UI
  # (Build & deploy → Dependency management) is set to match. Bump both
  # together with .nvmrc.
  NODE_VERSION = "22"
